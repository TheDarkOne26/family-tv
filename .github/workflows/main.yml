name: Update Family Playlist
on:
  schedule:
    # 10:00 UTC daily. GitHub often starts scheduled runs late (hours, at busy times).
    - cron: '0 10 * * *'
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build playlist
        run: python iptv_scraper.py

      - name: Commit if the playlist changed
        run: |
          if git diff --quiet -- family_safe.m3u; then
            echo "Playlist unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family_safe.m3u
          git commit -m "Update playlist ($(grep -c '^#EXTINF' family_safe.m3u) channels)"
          git pull --rebase origin main
          git push origin main
